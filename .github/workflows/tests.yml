name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Unit тесты - быстрые, без Docker
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.3'
        cache: true

    - name: Install Task
      uses: go-task/setup-task@v1

    - name: Generate proto files
      run: task proto:gen

    - name: Run unit tests
      run: task test:unit:cover

    - name: Upload unit test coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage-unit.out
        flags: unittests
        name: unit-tests

  # Интеграционные тесты - с Docker
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Install Task
      uses: go-task/setup-task@v1

    - name: Generate proto files
      run: task proto:gen

    - name: Run integration tests
      run: task test:integration:cover

    - name: Upload integration test coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage-integration.out
        flags: integrationtests
        name: integration-tests

  # Линтинг
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Install Task
      uses: go-task/setup-task@v1

    - name: Generate proto files
      run: task proto:gen

    - name: Run lint
      run: task test:lint

  # Общий статус для всех проверок
  tests-status:
    name: Tests Status
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint]
    if: always()
    
    steps:
    - name: Check tests status
      run: |
        if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
           [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
           [[ "${{ needs.lint.result }}" != "success" ]]; then
          echo "Some tests failed!"
          exit 1
        fi
        echo "All tests passed!"
