version: v2
clean: true
managed:
  enabled: false

plugins:
  - local: ../bin/protoc-gen-go
    out: ../pkg/proto
    opt:
      - paths=source_relative
  - local: ../bin/protoc-gen-go-grpc
    out: ../pkg/proto
    opt:
      - paths=source_relative
  - local: ../bin/protoc-gen-openapiv2
    out: ../api
    opt:
      - allow_merge=true
      - json_names_for_fields=false
      - use_go_templates=true
      - simple_operation_ids=true