syntax = "proto3";

package gophkeeper.v1;

option go_package = "github.com/BigSm0uk/GophKeeper/pkg/proto/gophkeeper/v1;gophkeepv1";

import "google/protobuf/timestamp.proto";
import "gophkeeper/v1/common.proto";
import "validate/validate.proto";

// CredentialsService manages login/password entries.
service CredentialsService {
  // Create stores a new credential entry.
  rpc Create(CredentialCreateRequest) returns (CredentialCreateResponse);
  // Get returns a single credential by id.
  rpc Get(CredentialGetRequest) returns (CredentialGetResponse);
  // List returns paginated credentials.
  rpc List(CredentialListRequest) returns (CredentialListResponse);
  // Update modifies an existing credential.
  rpc Update(CredentialUpdateRequest) returns (CredentialUpdateResponse);
  // Delete removes a credential entry.
  rpc Delete(CredentialDeleteRequest) returns (CredentialDeleteResponse);
}

// Credential represents a login/password entry.
message Credential {
  // id is the entry ID.
  string id = 1;
  // name is a user-provided label.
  string name = 2;
  // login is encrypted login data.
  string login = 3;
  // password is encrypted password data.
  string password = 4;
  // url is an optional associated URL.
  optional string url = 5;
  // metadata is an optional metadata field.
  optional string metadata = 6;
  // created_at is the creation timestamp.
  google.protobuf.Timestamp created_at = 7;
  // updated_at is the last update timestamp.
  google.protobuf.Timestamp updated_at = 8;
}

// CredentialCreateRequest creates a credential entry.
message CredentialCreateRequest {
  // name is a user-provided label.
  string name = 1 [(validate.rules).string = {
    min_len: 1,
    max_len: 255
  }];
  // login is encrypted login data.
  string login = 2 [(validate.rules).string.min_len = 1];
  // password is encrypted password data.
  string password = 3 [(validate.rules).string.min_len = 1];
  // url is an optional associated URL.
  optional string url = 4 [(validate.rules).string.uri = true];
  // metadata is an optional metadata field.
  optional string metadata = 5 [(validate.rules).string.max_len = 1000];
}
// CredentialCreateResponse returns the created credential.
message CredentialCreateResponse {
  // credential is the created entry.
  Credential credential = 1;
}

// CredentialGetRequest fetches a credential by id.
message CredentialGetRequest {
  // id is the credential ID.
  string id = 1 [(validate.rules).string = {
    min_len: 1,
    max_len: 255
  }];
}

// CredentialGetResponse returns a credential by id.
message CredentialGetResponse {
  // credential is the requested entry.
  Credential credential = 1;
}

// CredentialListRequest returns paginated credentials.
message CredentialListRequest {
  // page defines pagination options.
  PageRequest page = 1;
}

// CredentialListResponse returns paginated credentials.
message CredentialListResponse {
  // items is the list of credentials.
  repeated Credential items = 1;
  // page is pagination metadata.
  PageResponse page = 2;
}

// CredentialUpdateRequest updates an existing credential.
message CredentialUpdateRequest {
  // id is the credential ID.
  string id = 1 [(validate.rules).string = {
    min_len: 1,
    max_len: 255
  }];
  // name is a user-provided label.
  string name = 2 [(validate.rules).string = {
    min_len: 1,
    max_len: 255
  }];
  // login is encrypted login data.
  string login = 3 [(validate.rules).string.min_len = 1];
  // password is encrypted password data.
  string password = 4 [(validate.rules).string.min_len = 1];
  // url is an optional associated URL.
  optional string url = 5 [(validate.rules).string.uri = true];
  // metadata is an optional metadata field.
  optional string metadata = 6 [(validate.rules).string.max_len = 1000];
}
// CredentialUpdateResponse returns the updated credential.
message CredentialUpdateResponse {
  // credential is the updated entry.
  Credential credential = 1;
}

// CredentialDeleteRequest deletes a credential by id.
message CredentialDeleteRequest {
  // id is the credential ID.
  string id = 1 [(validate.rules).string = {
    min_len: 1,
    max_len: 255
  }];
}

// CredentialDeleteResponse confirms deletion.
message CredentialDeleteResponse {
  // deleted indicates successful deletion.
  bool deleted = 1;
}
