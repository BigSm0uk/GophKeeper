syntax = "proto3";

package gophkeeper.v1;

option go_package = "github.com/BigSm0uk/GophKeeper/pkg/proto/gophkeeper/v1;gophkeepv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "gophkeeper/v1/common.proto";
import "validate/validate.proto";

// TextsService manages text entries.
service TextsService {
  // Create stores a new text entry.
  rpc Create(TextCreateRequest) returns (TextCreateResponse) {
    option (google.api.http) = {
      post: "/texts"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create text"
      description: "Creates a new encrypted text note entry"
      tags: "Texts"
      operation_id: "createText"
      security: {
        security_requirement: {
          key: "Bearer"
        }
      }
    };
  }
  // Get returns a single text entry by id.
  rpc Get(TextGetRequest) returns (TextGetResponse) {
    option (google.api.http) = {
      get: "/texts/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get text"
      description: "Returns a single text entry by ID"
      tags: "Texts"
      operation_id: "getText"
      security: {
        security_requirement: {
          key: "Bearer"
        }
      }
    };
  }
  // List returns paginated text entries.
  rpc List(TextListRequest) returns (TextListResponse) {
    option (google.api.http) = {
      get: "/texts"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List texts"
      description: "Returns paginated list of text entries"
      tags: "Texts"
      operation_id: "listTexts"
      security: {
        security_requirement: {
          key: "Bearer"
        }
      }
    };
  }
  // Update modifies an existing text entry.
  rpc Update(TextUpdateRequest) returns (TextUpdateResponse) {
    option (google.api.http) = {
      put: "/texts/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update text"
      description: "Updates an existing text entry"
      tags: "Texts"
      operation_id: "updateText"
      security: {
        security_requirement: {
          key: "Bearer"
        }
      }
    };
  }
  // Delete removes a text entry.
  rpc Delete(TextDeleteRequest) returns (TextDeleteResponse) {
    option (google.api.http) = {
      delete: "/texts/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete text"
      description: "Deletes a text entry by ID"
      tags: "Texts"
      operation_id: "deleteText"
      security: {
        security_requirement: {
          key: "Bearer"
        }
      }
    };
  }
}

// Text represents a text entry.
message Text {
  // id is the entry ID.
  string id = 1;
  // name is a user-provided label.
  string name = 2;
  // content is encrypted text content.
  string content = 3;
  // metadata is an optional metadata field.
  optional string metadata = 4;
  // created_at is the creation timestamp.
  google.protobuf.Timestamp created_at = 5;
  // updated_at is the last update timestamp.
  google.protobuf.Timestamp updated_at = 6;
}

// TextCreateRequest creates a text entry.
message TextCreateRequest {
  // name is a user-provided label.
  string name = 1 [(validate.rules).string = {
    min_len: 1,
    max_len: 255
  }];
  // content is encrypted text content.
  string content = 2 [(validate.rules).string.min_len = 1];
  // metadata is an optional metadata field.
  optional string metadata = 3 [(validate.rules).string.max_len = 1000];
}
// TextCreateResponse returns the created text entry.
message TextCreateResponse {
  // text is the created entry.
  Text text = 1;
}

// TextGetRequest fetches a text entry by id.
message TextGetRequest {
  // id is the text ID.
  string id = 1 [(validate.rules).string.uuid = true];
}

// TextGetResponse returns a text entry by id.
message TextGetResponse {
  // text is the requested entry.
  Text text = 1;
}

// TextListRequest returns paginated text entries.
message TextListRequest {
  // page defines pagination options.
  PageRequest page = 1;
}

// TextListResponse returns paginated text entries.
message TextListResponse {
  // items is the list of texts.
  repeated Text items = 1;
  // page is pagination metadata.
  PageResponse page = 2;
}

// TextUpdateRequest updates a text entry.
message TextUpdateRequest {
  // id is the text ID.
  string id = 1 [(validate.rules).string.uuid = true];
  // name is a user-provided label.
  string name = 2 [(validate.rules).string = {
    min_len: 1,
    max_len: 255
  }];
  // content is encrypted text content.
  string content = 3 [(validate.rules).string.min_len = 1];
  // metadata is an optional metadata field.
  optional string metadata = 4 [(validate.rules).string.max_len = 1000];
}

// TextUpdateResponse returns the updated text entry.
message TextUpdateResponse {
  // text is the updated entry.
  Text text = 1;
}

// TextDeleteRequest deletes a text entry by id.
message TextDeleteRequest {
  // id is the text ID.
  string id = 1 [(validate.rules).string.uuid = true];
}

// TextDeleteResponse confirms deletion.
message TextDeleteResponse {
  // deleted indicates successful deletion.
  bool deleted = 1;
}
