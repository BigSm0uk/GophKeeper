version: "3"

interval: 500ms

vars:
  BIN_DIR: "{{.ROOT_DIR}}/bin"
  SERVER_DIR: "{{.ROOT_DIR}}/cmd/server/*"
  CONFIG_DIR: "{{.ROOT_DIR}}/configs"

tasks:
  build:
    cmds:
      - go build -o {{.BIN_DIR}}/server {{.SERVER_DIR}}
    silent: true

  run:
    deps: [build]
    cmds:
      - "{{.BIN_DIR}}/server --config={{.CONFIG_DIR}}/server.dev.json"
    silent: true

  run:w:
    deps: [build]
    watch: true
    sources:
      - 'internal/server/**/*.go'
    cmds:
      - "{{.BIN_DIR}}/server --config={{.CONFIG_DIR}}/server.dev.json"w
    silent: true

  run:dev:
    desc: "Run server in development mode"
    sources:
      - 'internal/server/**/*.go'
    cmds:
      - "go run {{.SERVER_DIR}} --config={{.CONFIG_DIR}}/server.dev.json"
    silent: true

  run:watch:
    desc: "Run server with file watching"
    watch: true
    sources:
      - 'internal/server/**/*.go'
    cmds:
      - "go run {{.SERVER_DIR}} --config={{.CONFIG_DIR}}/server.dev.json"
    silent: true

  migrate:up:
    desc: "Run database migrations up"
    cmds:
      - "goose -dir migrations postgres \"postgresql://user:password@localhost:5432/gophkeeper?sslmode=disable\" up"
    silent: true

  migrate:down:
    desc: "Run database migrations down"
    cmds:
      - "goose -dir migrations postgres \"postgresql://user:password@localhost:5432/gophkeeper?sslmode=disable\" down"
    silent: true

  migrate:status:
    desc: "Show migration status"
    cmds:
      - "goose -dir migrations postgres \"postgresql://user:password@localhost:5432/gophkeeper?sslmode=disable\" status"
    silent: true

  jwt:generate-keys:
    desc: "Generate RSA key pair for JWT tokens"
    cmds:
      - "mkdir -p keys"
      - "openssl genrsa -out keys/jwt_private.pem 2048"
      - "openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem"
      - "echo 'JWT keys generated successfully in keys/ directory'"
    silent: true