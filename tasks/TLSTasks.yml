# https://taskfile.dev
# Tasks for TLS certificate generation

version: "3"

vars:
  KEYS_DIR: "{{.ROOT_DIR}}/keys"

tasks:
  generate-server:
    desc: Generate CA and server TLS certificates
    cmds:
      - mkdir -p "{{.KEYS_DIR}}"

      - |
        cat > "{{.KEYS_DIR}}/server-ext.cnf" <<EOF
        [req]
        distinguished_name = req_distinguished_name
        req_extensions = v3_req
        prompt = no

        [req_distinguished_name]
        CN = localhost

        [v3_req]
        subjectAltName = @alt_names

        [alt_names]
        DNS.1 = localhost
        IP.1 = 127.0.0.1
        IP.2 = 0.0.0.0
        EOF

      - openssl genrsa -out "{{.KEYS_DIR}}/ca.key" 4096
      - openssl req -new -x509 -key "{{.KEYS_DIR}}/ca.key" -sha256 -subj "/CN=GophKeeper CA" -days 3650 -out "{{.KEYS_DIR}}/ca.crt"

      - openssl genrsa -out "{{.KEYS_DIR}}/server.key" 4096
      - openssl req -new -key "{{.KEYS_DIR}}/server.key" -out "{{.KEYS_DIR}}/server.csr" -config "{{.KEYS_DIR}}/server-ext.cnf"

      - openssl x509 -req -in "{{.KEYS_DIR}}/server.csr" -CA "{{.KEYS_DIR}}/ca.crt" -CAkey "{{.KEYS_DIR}}/ca.key" -CAcreateserial -out "{{.KEYS_DIR}}/server.crt" -days 365 -sha256 -extfile "{{.KEYS_DIR}}/server-ext.cnf" -extensions v3_req

      - rm -f "{{.KEYS_DIR}}/server.csr" "{{.KEYS_DIR}}/ca.key" "{{.KEYS_DIR}}/ca.srl" "{{.KEYS_DIR}}/server-ext.cnf"
      - echo "TLS certificates generated in {{.KEYS_DIR}}/"
