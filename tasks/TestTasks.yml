# https://taskfile.dev
# Tasks for running tests (unit, integration, lint)

version: "3"

vars:
  ROOT_DIR: "{{.PWD}}"
  BIN_DIR: "{{.ROOT_DIR}}/bin"

  MOCKGEN_VERSION: "v0.6.0"
  MOCKGEN: "{{.BIN_DIR}}/mockgen"

  COVERAGE_UNIT: "{{.ROOT_DIR}}/coverage-unit.out"
  COVERAGE_INTEGRATION: "{{.ROOT_DIR}}/coverage-integration.out"

tasks:
  # Install mockgen binary into ./bin (go.uber.org/mock)
  mockgen:install:
    desc: Install mockgen binary into ./bin
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - |
        [ -f "{{.MOCKGEN}}" ] || {
          echo '📦 Installing mockgen...'
          GOBIN="{{.BIN_DIR}}" go install go.uber.org/mock/mockgen@{{.MOCKGEN_VERSION}}
        }

  # Generate mocks for domain interfaces into internal/server/domain/mocks
  mockgen:gen:
    deps: [mockgen:install]
    desc: Generate mocks for domain interfaces
    dir: internal/server/domain
    cmds:
      - mkdir -p mocks
      - |
        "{{.MOCKGEN}}" -source=interfaces/user_repo.go -destination=mocks/user_repo.go -package=mocks
        "{{.MOCKGEN}}" -source=interfaces/session_repo.go -destination=mocks/session_repo.go -package=mocks
        "{{.MOCKGEN}}" -source=interfaces/binaries_repo.go -destination=mocks/binaries_repo.go -package=mocks
        "{{.MOCKGEN}}" -source=interfaces/cards_repo.go -destination=mocks/cards_repo.go -package=mocks
        "{{.MOCKGEN}}" -source=interfaces/credentials_repo.go -destination=mocks/credentials_repo.go -package=mocks
        "{{.MOCKGEN}}" -source=interfaces/texts_repo.go -destination=mocks/texts_repo.go -package=mocks
        "{{.MOCKGEN}}" -source=interfaces/lifecycle.go -destination=mocks/lifecycle.go -package=mocks
        "{{.MOCKGEN}}" -source=interfaces/token_service.go -destination=mocks/token_service.go -package=mocks

  # Run all tests (unit + integration)
  default:
    desc: Run unit and integration tests
    cmds:
      - task: test:unit
      - task: test:integration

  # Unit tests only (excludes tests/integration)
  unit:
    deps: [mockgen:gen]
    desc: Run unit tests
    cmds:
      - go test -v -race $(go list ./... | grep -v tests/integration)

  # Unit tests with coverage
  unit:cover:
    deps: [mockgen:gen]
    desc: Run unit tests with coverage report
    cmds:
      - go test -v -race -coverprofile={{.COVERAGE_UNIT}} -covermode=atomic $(go list ./... | grep -v tests/integration)
      - go tool cover -func={{.COVERAGE_UNIT}}

  # Integration tests (require DB, see tests/integration)
  integration:
    desc: Run integration tests
    cmds:
      - go test -v -race ./tests/integration/...

  # Integration tests with coverage
  integration:cover:
    desc: Run integration tests with coverage
    cmds:
      - go test -v -race -coverprofile={{.COVERAGE_INTEGRATION}} -covermode=atomic ./tests/integration/...
      - go tool cover -func={{.COVERAGE_INTEGRATION}}

  # Install golangci-lint into ./bin
  lint:install:
    desc: Install golangci-lint binary
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - |
        [ -f "{{.BIN_DIR}}/golangci-lint" ] || {
          echo '📦 Installing golangci-lint...'
          GOBIN="{{.BIN_DIR}}" go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        }

  # Lint (golangci-lint)
  lint:
    deps: [lint:install]
    desc: Run golangci-lint
    cmds:
      - "{{.BIN_DIR}}/golangci-lint run --timeout=5m ./..."

  # All checks: unit, integration, lint
  all:
    desc: Run unit tests, integration tests and lint
    cmds:
      - task: unit
      - task: integration
      - task: lint
